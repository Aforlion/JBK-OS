# Development Environment Configuration
# JBK-OS — config/environments/development.yaml
#
# This file overrides the base runtime.yaml for local development.
# Mirrors the DEVELOPMENT profile in core/deployment_manager.py.
#
# USAGE: Load this file in your local bootstrap when
#        JBK_ENVIRONMENT=DEVELOPMENT is set.

environment: DEVELOPMENT

runtime:
  logging: DEBUG
  hot_reload: true
  monitoring: false
  security: relaxed

ai:
  provider: mock
  # Gemini API key is not required in development.
  # Use the mock AI provider for all local testing.

web:
  port: 8080
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

# Secret references — development values sourced from .env (never committed)
# In production these are injected by Secret Manager.
secrets:
  source: env_file     # Reads from .env in development
