# Development Environment Configuration
# JBK-OS — config/environments/development.yaml

environment: DEVELOPMENT

runtime:
  logging: DEBUG
  hot_reload: true
  monitoring: false
  security: relaxed

ai:
  provider: gemini
  model: gemini-2.5-flash
  timeout_seconds: 15
  max_retries: 2
  backoff_factor: 1.5
  temperature: 0.7
  max_tokens: 2048

web:
  port: 8080
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

# Sourced from local environment vars
secrets:
  source: env_file
