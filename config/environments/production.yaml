# Production Environment Configuration
# JBK-OS — config/environments/production.yaml

environment: PRODUCTION

runtime:
  logging: INFO
  hot_reload: false
  monitoring: true
  security: strict

ai:
  provider: gemini
  model: gemini-2.5-flash
  timeout_seconds: 30
  max_retries: 3
  backoff_factor: 2.0
  temperature: 0.7
  max_tokens: 4096

web:
  port: 8080
  cors_origins:
    - "https://YOUR_CLOUD_RUN_URL"

# Secret references
secrets:
  source: cloud_run_env
  references:
    app_secret_key: jbk-os-secret-key
    gemini_api_key: gemini-api-key
    database_url:   database-url
    oauth_secret:   oauth-client-secret
