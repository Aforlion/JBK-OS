name: JBK-OS CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install fastapi websockets httpx
          fi

      # Step 4: Repository Validation
      - name: Repository Validation
        run: |
          python scripts/validate_repo.py

      # Step 5: Static Validation (Compile Check - source files only)
      - name: Compile Validation
        run: |
          python -m compileall -q core web portal scripts bootstrap.py main.py runtime.py

      # Step 6: Automated Testing
      - name: Run Certified Test Suite
        run: |
          python -m unittest discover tests > test_results.log 2>&1 || (cat test_results.log && exit 1)
          cat test_results.log

      # Step 7: Archive Build and Test Logs
      - name: Archive Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-python-${{ matrix.python-version }}
          path: test_results.log
